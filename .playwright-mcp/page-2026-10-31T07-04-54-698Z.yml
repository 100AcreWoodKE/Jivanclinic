                - link [ref=f15e254] [cursor=pointer]:
                  - /url: /jivan_wellness_ke/reel/DfG8zZlscpG/
                  - 'img "Yesterday, we brought healthcare professionals together at Novotel Nairobi for the Jivan Wellness Clinician Breakfast, a morning of meaningful conversations on the future of healthcare✨ A special thank you to our partners, @precisionwellnessdxb_ led by Dr. Tamer Degheidy, for an insightful presentation. He highlighted the importance of sleep as a foundation of long-term health, recovery, and overall well-being, a reminder that longevity starts with how we care for our bodies every day. Join us today, Friday, 30th October, for the official opening of Jivan Wellness as we celebrate a new approach to integrated wellness and precision health.🎉 📍 Jivan Wellness, Nairobi ⏰ 9:00 AM – 12:00 PM We look forward to welcoming you! #jivanwellness #precisionmedicine #longevity #sleephealth #neurowellness" [ref=f15e257]'
                  - generic:
                    - generic:
                      - generic:
                        - img "Clip"
                - link [ref=f15e260] [cursor=pointer]:
                  - /url: /precisionwellness_ke/reel/DfEr7CCx9Zs/
                  - 'img "A peek inside Precision Wellness Kenya! ✨🇰🇪 Our newest franchise brings together wellness technology, expert guidance, and personalised care in Nairobi. Proud to bring this vision to life with Jivan Wellness and grateful to Jai Pandit for his partnership. 🤝 Your next wellness destination? 👀 #precisionwellnesskenya #nairobiwellness #longevity" [ref=f15e263]'
                  - generic:
                    - generic:
                      - generic:
                        - img "Clip"
                - link [ref=f15e266] [cursor=pointer]:
                  - /url: /jivan_wellness_ke/p/DfEhNHEMHYv/
                  - 'img "A new chapter in wellness begins!! Join us as we celebrate the opening of Jivan wellness. An evening dedicated to connection, wellbeing and new beginnings✨ 📅Friday, 30th October 2026 🕘9:00AM - 12:00PM 📍Jivan Wellness, Harmony centre, General Mathenge Gardens. Come be part of the experience. Register now using the link in bio!! #jivanwellness #precisionwellnesskenya #opening #openingsocial" [ref=f15e269]'
              - generic [ref=f15e271]:
                - link [ref=f15e273] [cursor=pointer]:
                  - /url: /precisionwellnessdxb_/p/De8mNPBgaZ9/
                  - 'img "Nairobi, the wait is almost over. ✨ On 31 October 2026, Precision Wellness Kenya opens its doors, and we can’t wait to welcome you. Discover a new wellness destination where science, personalised attention and a warm welcome come together. Save the date and follow us for opening updates. #PrecisionWellness #PrecisionWellnessKenya #NairobiWellness #OpeningSoon #wellnesskenya" [ref=f15e276]'
                - link [ref=f15e279] [cursor=pointer]:
                  - /url: /precisionwellnessdxb_/p/De8mEbggz9b/
                  - 'img "Your wellness journey should be as individual as you are. Meet Precision Wellness. We bring together advanced wellness technologies and personalised journeys, with science at the heart of our approach and you at the centre of the experience. 🌿 Soon, that experience will have a home in Nairobi. Follow us to discover what’s coming. #PrecisionWellness #PrecisionWellnessKenya #PersonalisedWellness #ScienceLedWellness #nairobiwellness" [ref=f15e282]'
                - link [ref=f15e285] [cursor=pointer]:
                  - /url: /precisionwellnessdxb_/p/De8lppmAlTK/
                  - 'img "Nairobi, a new chapter in wellness is coming. 🌿 Precision Wellness is arriving in Kenya, bringing a science-led approach to well-being and a more personal way to begin your wellness journey. We look forward to becoming part of your city. Follow along as we get ready to open our doors. #PrecisionWellness #PrecisionWellnessKenya #NairobiWellness #WellnessKenya #comingsoon" [ref=f15e288]'
              - generic [ref=f15e290]:
                - link [ref=f15e292] [cursor=pointer]:
                  - /url: /jivan_wellness_ke/reel/DcapM_GPUz2/
                  - 'img "When the people behind a clinic are this excited about what they’re building, you know something special is coming. We asked our team what they’re most looking forward to at Jivan. Watch what happens when people truly believe in what they do. . . #mentalhealth #nairobi #kenya #jivanwellness #mentalhealthawareness" [ref=f15e295]'
                  - generic:
                    - generic:
                      - generic:
                        - img "Clip"
                - link [ref=f15e298] [cursor=pointer]:
                  - /url: /jivan_wellness_ke/reel/DbqCorGvC2p/
                  - 'img "Three words. No overthinking. We asked our team to describe themselves — and honestly, we couldn’t have said it better ourselves. Meet the people behind Jivan, in their own words. . . #jivanwellness #kenya #nairobi #meetourteam #mentalhealth" [ref=f15e301]'
                  - generic:
                    - generic:
                      - generic:
                        - img "Clip"
                - link [ref=f15e304] [cursor=pointer]:
                  - /url: /jivan_wellness_ke/reel/DbVLb9LvZ67/
                  - 'img "Every great clinic is built on the people inside it. These are the faces you’ll see when you walk through our doors, the ones who will remember your name, ask how you’re doing, and genuinely mean it when they say they’re here for you. We are so proud to introduce the heart of Jivan. Meet our team. 💛 . #jivanwellness #kenya #nairobi #mentalhealth #mentalhealthawareness" [ref=f15e307]'
                  - generic:
                    - generic:
                      - generic:
                        - img "Clip"
              - generic [ref=f15e309]:
                - link [ref=f15e311] [cursor=pointer]:
                  - /url: /jivan_wellness_ke/reel/Da5mOywvO4j/
                  - 'img "Nairobi showed up for brain health — and the conversation in that room was long overdue. Jivan Wellness brought together medical professionals for an intimate rTMS Clinical Briefing. The science, the technology, the questions that don’t usually get asked out loud — all of it, on the table. Two mornings, one room, and a group of people who came ready to listen, challenge, and rethink what treating the brain can actually look like. This is what it looks like when a city starts taking brain health seriously. We’re just getting started. And we’re glad you’re part of it. . #mentalhealth #nairobi #kenya #jivanwellness #awareness" [ref=f15e314]'
                  - generic:
                    - generic:
                      - generic:
                        - img "Clip"
                - link [ref=f15e317] [cursor=pointer]:
                  - /url: /jivan_wellness_ke/p/DakB2UEPUku/
                  - 'img "Behind Jivan is a team that takes your health as seriously as you do — and on some days, a little more. They came from different backgrounds, different disciplines, different corners of medicine and wellness. But they’re here for the same reason: because they believe the brain and the body deserve to be looked after together. Meet the people who make that possible every single day. . . #jivanwellness #nairobi #kenya #mentalhealth #awareness" [ref=f15e320]'
                - link [ref=f15e323] [cursor=pointer]:
                  - /url: /jivan_wellness_ke/reel/DZ26b4pvay4/
                  - 'img "We talk about fathers as providers, protectors, the steady ones. What we don’t talk about is his mental health — the stress, the tiredness, the things he never names. “I’m fine” became his default — not because it’s true, but because no one’s pushed past it. Happy Father’s Day to every father carrying more than he lets on. We see you.❤️ . . #nairobi #kenya #fathersday #father #mentalhealth" [ref=f15e326]'
                  - generic:
                    - generic:
                      - generic:
                        - img "Clip"
